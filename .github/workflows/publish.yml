# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - 'main'       # Run the workflow when pushing to the main branch
  pull_request:
    branches:
      - '*'          # Run the workflow for all pull requests
  release:
    types:
      - published    # Run the workflow when a new GitHub release is published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget
  GeneratedFilesDirectory: ${{ github.workspace}}/Astc-Encoder-CSharp
  TestDirectory: ${{ github.workspace}}/Astc-Tests

defaults:
  run:
    shell: pwsh

jobs:
  build_generator:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: ./.github/dotnetsetup
    - name: Build Generator
      run: dotnet build Astc-Encoder-CSharp-Generator --configuration Release --output Generator
    - name: Run Generator
      run: >
           Generator/Astc-Encoder-CSharp-Generator 
           --Version latest 
           --SourceFilePath Source/astcenc.h 
           --CacheFilePath AstcAssets/cache.cache 
           --MethodExportName ASTCENC_PUBLIC 
           --GeneratedFilesNamespace AstcEncoder 
           --ProjectPath ${{ env.GeneratedFilesDirectory }} 
           --InternalTypes AstcencImage,AstcencContext
    - uses: actions/upload-artifact@v4
      with:
        name: generatedFiles
        if-no-files-found: error
        retention-days: 7
        path: ${{ env.GeneratedFilesDirectory }}/Generated/*
    - uses: actions/upload-artifact@v4
      with:
        name: runtimeFiles
        if-no-files-found: error
        retention-days: 7
        path: ${{ env.GeneratedFilesDirectory }}/runtimes/*

  create_nuget:
    runs-on: ubuntu-latest
    needs: [ build_generator ]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Get all history to allow automatic versioning using MinVer

    - uses: actions/download-artifact@v4
      with:
        name: generatedFiles
        path: ${{ env.GeneratedFilesDirectory }}/Generated

    - uses: actions/download-artifact@v4
      with:
        name: runtimeFiles
        path: ${{ env.GeneratedFilesDirectory }}/runtimes

    # Install the .NET SDK indicated in the global.json file
    - name: Setup .NET
      uses: ./.github/dotnetsetup

    # Create the NuGet package in the folder from the environment variable NuGetDirectory
    - run: dotnet pack Astc-Encoder-CSharp --configuration Release --output ${{ env.NuGetDirectory }}

    # Publish the NuGet package as an artifact, so they can be used in the following jobs
    - uses: actions/upload-artifact@v4
      with:
        name: nuget
        if-no-files-found: error
        retention-days: 7
        path: ${{ env.NuGetDirectory }}/*.nupkg

  validate_nuget:
    runs-on: ubuntu-latest
    needs: [ create_nuget ]
    steps:
      # Install the .NET SDK indicated in the global.json file
      - name: Setup .NET
        uses: ./.github/dotnetsetup

      # Download the NuGet package created in the previous job
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Install nuget validator
        run: dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global

      # Validate metadata and content of the NuGet package
      # https://www.nuget.org/packages/Meziantou.Framework.NuGetPackageValidation.Tool#readme-body-tab
      # If some rules are not applicable, you can disable them
      # using the --excluded-rules or --excluded-rule-ids option
      - name: Validate package
        run: meziantou.validate-nuget-package (Get-ChildItem "${{ env.NuGetDirectory }}/*.nupkg") --excluded-rules IconMustBeSet,ReadmeMustBeSet

  build_tests:
    runs-on: ubuntu-latest
    needs: [ build_generator ]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: generatedFiles
        path: ${{ env.GeneratedFilesDirectory }}/Generated
    - uses: actions/download-artifact@v4
      with:
        name: runtimeFiles
        path: ${{ env.GeneratedFilesDirectory }}/runtimes
    - uses: actions/download-artifact@v4
      with:
        name: runtimeFiles
        path: ${{ github.workspace}}/AstcEncoderTest/bin/Release/net10.0/runtimes
    - uses: actions/upload-artifact@v4
      with:
        name: jobstatedownload
        if-no-files-found: error
        retention-days: 7
        path: ${{ github.workspace}}/* 
    - name: Setup .NET
      uses: ./.github/dotnetsetup
    - uses: actions/upload-artifact@v4
      with:
        name: jobstatedownload2
        if-no-files-found: error
        retention-days: 7
        path: ${{ github.workspace}}/* 
    - name: Build AstcGeneratorTask Test
      run: dotnet build AstcGeneratorTaskTest --configuration Release --output ${{ env.TestDirectory }}/AstcGeneratorTaskTest
    - name: Build AstcEncoderTest Test
      run: dotnet build AstcEncoderTest --configuration Release --output ${{ env.TestDirectory }}/AstcEncoderTest
    - uses: actions/upload-artifact@v4
      with:
        name: testFiles
        if-no-files-found: error
        retention-days: 7
        path: ${{ env.TestDirectory }}/* 

  run_test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64

          # Windows
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64

          # macOS
          - os: macos-15-intel
            arch: x64
          - os: macos-latest
            arch: arm64

    runs-on: ${{ matrix.os }}

    needs: [ build_tests ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: testFiles
          path: ${{ env.TestDirectory }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        shell: bash
        run: |
          dotnet test \
            --test-modules "${{ env.TestDirectory }}/AstcGeneratorTaskTest/AstcGeneratorTaskTest.dll" \
                           "${{ env.TestDirectory }}/AstcEncoderTest/AstcEncoderTest.dll" \
            --no-build
  deploy:
    # Publish only when creating a GitHub Release
    # https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository
    # You can update this logic if you want to manage releases differently
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [ validate_nuget, run_test ]
    steps:
      # Download the NuGet package created in the previous job
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      # Install the .NET SDK indicated in the global.json file
      - name: Setup .NET
        uses: ./.github/dotnetsetup

      # Publish all NuGet packages to NuGet.org
      # Use --skip-duplicate to prevent errors if a package with the same version already exists.
      # If you retry a failed workflow, already published packages will be skipped without error.
      - name: Publish NuGet package
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "${{ secrets.NUGET_APIKEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }